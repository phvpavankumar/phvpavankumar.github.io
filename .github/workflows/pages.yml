name: Portfolio Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec ruby scripts/content_index.rb --check
      - run: bundle exec jekyll build --config _config.yml
        env:
          JEKYLL_ENV: production
      - run: bundle exec ruby scripts/verify_site.rb _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
