<div class="profile-credentials" aria-label="Experience and verified credentials">
  <p class="profile-proof">AI/ML experience <strong>since 2021</strong></p>
  {% for credential in site.data.profile.credentials %}
  <a href="{{ credential.url | escape }}" target="_blank" rel="noopener">{{ credential.label | escape }} <span aria-hidden="true">↗</span></a>
  {% endfor %}
</div>
