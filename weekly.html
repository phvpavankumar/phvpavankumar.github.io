---
layout: default
title: Finance × AI Weekly
permalink: /weekly/
---
<div class="phv-sec" style="border-top:0">
  <div class="phv-wrap">
    <div class="phv-head-block">
      <p class="phv-kicker">Finance × AI Weekly</p>
      <h1 class="phv-h2">All entries</h1>
      <nav class="content-nav" aria-label="Writing archive"><a href="{{ '/writing/' | relative_url }}">Writing by year</a><a href="{{ '/archive/' | relative_url }}">All content by year</a></nav>
    </div>
    <div class="phv-series">
      {% for post in site.posts %}
      <a class="entry" href="{{ post.url | relative_url }}">
        <span class="d">{{ post.week }}</span>
        <span class="t">{{ post.title }}</span>
        <span class="tag2">{{ post.category }}</span>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
